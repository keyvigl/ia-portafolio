site_name: "Keyvi Garcia · AI Portfolio"
site_url: https://keyvigl.github.io/ia-portafolio
site_description: "Portafolio profesional de Inteligencia Artificial — Machine Learning, Deep Learning, Computer Vision, NLP y MLOps."
site_author: "Keyvi Garcia"


theme:
  name: material
  language: es
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.highlight
    - search.suggest
    - search.share
  palette:
    # Esquema oscuro — apariencia principal (por defecto)
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    # Esquema claro
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
  font:
    text: 'Inter'
    code: 'JetBrains Mono'

plugins:
  - search
  - awesome-pages


  - git-revision-date-localized:
      type: date
      locale: es
      timezone: America/Montevideo
      fallback_to_build_date: true
  - glightbox  # para lightbox en imágenes

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

